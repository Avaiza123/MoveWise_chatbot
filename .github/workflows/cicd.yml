name: MoveWise Chatbot CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:
    name: Auto Test
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend_chatbot/requirements.txt

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_chatbot/requirements.txt
          pip install pytest pytest-cov httpx

          if (Test-Path "backend_chatbot/requirements-dev.txt") {
            pip install -r backend_chatbot/requirements-dev.txt
          }

      - name: Run tests with coverage
        shell: powershell
        working-directory: backend_chatbot
        run: |
          pytest -v --cov=. --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend_chatbot/coverage.xml


  qa:
    name: Auto QA
    runs-on: [self-hosted, Windows, X64]
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend_chatbot/requirements.txt

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_chatbot/requirements.txt
          pip install ruff bandit pip-audit

          if (Test-Path "backend_chatbot/requirements-dev.txt") {
            pip install -r backend_chatbot/requirements-dev.txt
          }

      - name: Ruff lint
        shell: powershell
        working-directory: backend_chatbot
        run: |
          ruff check .

      - name: Ruff format check
        shell: powershell
        working-directory: backend_chatbot
        run: |
          ruff format --check .

      - name: Security scan
        shell: powershell
        working-directory: backend_chatbot
        run: |
          bandit -r . -x tests

      - name: Dependency security audit
        shell: powershell
        working-directory: backend_chatbot
        run: |
          pip-audit -r requirements.txt


  build:
    name: Build Docker
    runs-on: [self-hosted, Windows, X64]
    needs:
      - test
      - qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        shell: powershell
        run: |
          docker --version
          docker info

      - name: Build Docker image
        shell: powershell
        run: |
          docker build `
            -t movewise-chatbot:${{ github.sha }} `
            .

      - name: Verify Docker image
        shell: powershell
        run: |
          docker image inspect movewise-chatbot:${{ github.sha }}

      - name: Start Docker container
        shell: powershell
        run: |
          docker run -d `
            --name movewise-chatbot `
            -p 8000:8000 `
            movewise-chatbot:${{ github.sha }}

      - name: Wait for API
        shell: powershell
        run: |
          Write-Host "Waiting for MoveWise API..."

          $healthy = $false

          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "http://localhost:8000/health" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -eq 200) {
                Write-Host "API is healthy."
                $healthy = $true
                break
              }
            }
            catch {
              Write-Host "Attempt $i failed. Waiting..."
            }

            Start-Sleep -Seconds 2
          }

          if (-not $healthy) {
            Write-Host "API failed to start."
            docker logs movewise-chatbot
            exit 1
          }

      - name: Test health endpoint
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "http://localhost:8000/health" `
            -UseBasicParsing

      - name: Test greeting endpoint
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "http://localhost:8000/api/greeting" `
            -UseBasicParsing

      - name: Test chatbot endpoint
        shell: powershell
        run: |
          $body = @{
            message = "What is a good beginner workout?"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "http://localhost:8000/api/chat" `
            -Method POST `
            -ContentType "application/json" `
            -Body $body

      - name: Test fitness endpoint
        shell: powershell
        run: |
          $body = @{
            message = "What exercise should I do?"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "http://localhost:8000/api/fitness" `
            -Method POST `
            -ContentType "application/json" `
            -Body $body

      - name: Test health endpoint
        shell: powershell
        run: |
          $body = @{
            message = "How much sleep should I get?"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "http://localhost:8000/api/health" `
            -Method POST `
            -ContentType "application/json" `
            -Body $body

      - name: Test diet endpoint
        shell: powershell
        run: |
          $body = @{
            message = "What should I eat?"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "http://localhost:8000/api/diet" `
            -Method POST `
            -ContentType "application/json" `
            -Body $body

      - name: Test food endpoint
        shell: powershell
        run: |
          $body = @{
            message = "How many calories are in chicken?"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "http://localhost:8000/api/food" `
            -Method POST `
            -ContentType "application/json" `
            -Body $body

      - name: Test knowledge statistics
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "http://localhost:8000/api/knowledge/stats" `
            -UseBasicParsing

      - name: Show Docker logs
        if: always()
        shell: powershell
        run: |
          docker logs movewise-chatbot

      - name: Stop Docker container
        if: always()
        shell: powershell
        run: |
          docker stop movewise-chatbot 2>$null
          docker rm movewise-chatbot 2>$null


  deploy:
    name: Auto Deploy
    runs-on: [self-hosted, Windows, X64]
    needs:
      - test
      - qa
      - build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Deploy application
        shell: powershell
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RENDER_DEPLOY_HOOK)) {
            Write-Error "RENDER_DEPLOY_HOOK secret is not configured."
            exit 1
          }

          Write-Host "Starting MoveWise Chatbot deployment..."

          Invoke-WebRequest `
            -Uri $env:RENDER_DEPLOY_HOOK `
            -Method POST `
            -UseBasicParsing

          Write-Host "Deployment triggered successfully."


  smoke-test:
    name: Production Smoke Test
    runs-on: [self-hosted, Windows, X64]
    needs:
      - deploy

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Wait for deployment
        shell: powershell
        run: |
          Write-Host "Waiting for production deployment..."
          Start-Sleep -Seconds 30

      - name: Production health check
        shell: powershell
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_URL)) {
            Write-Error "PRODUCTION_URL secret is not configured."
            exit 1
          }

          Invoke-WebRequest `
            -Uri "$($env:PRODUCTION_URL)/health" `
            -UseBasicParsing

      - name: Production greeting test
        shell: powershell
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          Invoke-WebRequest `
            -Uri "$($env:PRODUCTION_URL)/api/greeting" `
            -UseBasicParsing

      - name: Production chatbot test
        shell: powershell
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          $body = @{
            message = "What is a good beginner workout?"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "$($env:PRODUCTION_URL)/api/chat" `
            -Method POST `
            -ContentType "application/json" `
            -Body $body

      - name: Deployment successful
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "MoveWise deployment successful!"
          Write-Host "======================================"
