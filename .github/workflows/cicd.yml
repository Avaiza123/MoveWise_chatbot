name: MoveWise Chatbot CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_EXE: 'C:\Users\avaiza.shahid\AppData\Local\Programs\Python\Python314\python.exe'
  VENV: '.ci-venv'

jobs:

  # ==========================================================
  # 1. AUTO TEST
  # ==========================================================
  test:
    name: Auto Test
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          if (-not (Test-Path $env:PYTHON_EXE)) {
            throw "Python 3.14 not found."
          }

          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
            Remove-Item $venv -Recurse -Force
          }

          & $env:PYTHON_EXE -m venv $venv

      - name: Install dependencies
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m pip install --upgrade pip

          & $python -m pip install `
            -r "$env:GITHUB_WORKSPACE\backend_chatbot\requirements.txt"

          & $python -m pip install `
            -r "$env:GITHUB_WORKSPACE\requirements-dev.txt"

      - name: Run tests
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m pytest `
            -v `
            --cov=backend_chatbot `
            --cov-report=term `
            --cov-report=xml:coverage.xml

          if ($LASTEXITCODE -ne 0) {
            throw "Tests failed."
          }

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
            Remove-Item $venv -Recurse -Force
          }


    # ==========================================================
  # 2. AUTO QA
  # ==========================================================
  qa:
    name: Auto QA
    runs-on: [self-hosted, Windows, X64]
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QA
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
            Remove-Item $venv -Recurse -Force
          }

          & $env:PYTHON_EXE -m venv $venv

          $python = Join-Path $venv "Scripts\python.exe"

          & $python -m pip install --upgrade pip

          & $python -m pip install `
            -r "$env:GITHUB_WORKSPACE\backend_chatbot\requirements.txt"

          & $python -m pip install `
            -r "$env:GITHUB_WORKSPACE\requirements-dev.txt"

      - name: Security scan
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: backend_chatbot
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m bandit -r . -x tests

          if ($LASTEXITCODE -ne 0) {
            throw "Security QA failed."
          }

      - name: Dependency audit
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: backend_chatbot
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m pip_audit -r requirements.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency audit failed."
          }

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
            Remove-Item $venv -Recurse -Force
          }
  # ==========================================================
  # 3. DOCKER BUILD + TEST
  # ==========================================================
  docker:
    name: Docker Build & Test
    runs-on: [self-hosted, Windows, X64]
    needs: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker build `
            -t movewise-chatbot:${{ github.sha }} `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed."
          }

      - name: Run Docker container
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker rm -f movewise-chatbot 2>$null

          docker run -d `
            --name movewise-chatbot `
            -p 8000:8000 `
            movewise-chatbot:${{ github.sha }}

          if ($LASTEXITCODE -ne 0) {
            throw "Docker container failed to start."
          }

      - name: Docker health test
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $ready = $false

          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "http://localhost:8000/health" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -eq 200) {
                $ready = $true
                break
              }
            }
            catch {}

            Start-Sleep 2
          }

          if (-not $ready) {
            docker logs movewise-chatbot
            throw "Docker health check failed."
          }

          $health = Invoke-RestMethod `
            -Uri "http://localhost:8000/health"

          if ($health.status -ne "healthy") {
            throw "API health check failed."
          }

          Write-Host "Docker test PASSED."

      - name: Cleanup Docker
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker stop movewise-chatbot 2>$null
          docker rm movewise-chatbot 2>$null


  # ==========================================================
  # 4. DEPLOY
  # ==========================================================
  deploy:
    name: Deploy to Render
    runs-on: [self-hosted, Windows, X64]
    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Deploy
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RENDER_DEPLOY_HOOK)) {
            throw "RENDER_DEPLOY_HOOK is not configured."
          }

          $response = Invoke-WebRequest `
            -Uri $env:RENDER_DEPLOY_HOOK `
            -Method POST `
            -UseBasicParsing

          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
            throw "Deployment failed."
          }

          Write-Host "========================================"
          Write-Host "DEPLOYMENT SUCCESSFUL"
          Write-Host "========================================"
