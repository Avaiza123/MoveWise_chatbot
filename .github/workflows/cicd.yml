name: MoveWise Chatbot CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  PYTHON_EXE: 'C:\Users\avaiza.shahid\AppData\Local\Programs\Python\Launcher\py.exe'

jobs:
  # ---------------- TEST ----------------
  test:
    name: Auto Test
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          & "$env:PYTHON_EXE" -$env:PYTHON_VERSION -m pip install --upgrade pip
          & "$env:PYTHON_EXE" -$env:PYTHON_VERSION -m pip install -r backend_chatbot/requirements.txt
          & "$env:PYTHON_EXE" -$env:PYTHON_VERSION -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: backend_chatbot
        run: |
          & "$env:PYTHON_EXE" -$env:PYTHON_VERSION -m pytest -v --cov=. --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend_chatbot/coverage.xml
          if-no-files-found: ignore

  # ---------------- QA ----------------
  qa:
    name: Auto QA
    runs-on: [self-hosted, Windows, X64]
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          & "$env:PYTHON_EXE" -$env:PYTHON_VERSION -m pip install --upgrade pip
          & "$env:PYTHON_EXE" -$env:PYTHON_VERSION -m pip install -r backend_chatbot/requirements.txt
          & "$env:PYTHON_EXE" -$env:PYTHON_VERSION -m pip install -r requirements-dev.txt

      - name: Lint, format, security, audit
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: backend_chatbot
        run: |
          & "$env:PYTHON_EXE" -$env:PYTHON_VERSION -m ruff check .
          & "$env:PYTHON_EXE" -$env:PYTHON_VERSION -m ruff format --check .
          & "$env:PYTHON_EXE" -$env:PYTHON_VERSION -m bandit -r . -x tests
          & "$env:PYTHON_EXE" -$env:PYTHON_VERSION -m pip_audit -r requirements.txt

  # ---------------- BUILD ----------------
  build:
    name: Build Docker
    runs-on: [self-hosted, Windows, X64]
    needs: [test, qa]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker rm -f movewise-chatbot 2>$null
          docker build -t movewise-chatbot:${{ github.sha }} .
          docker run -d --name movewise-chatbot -p 8000:8000 movewise-chatbot:${{ github.sha }}

      - name: Wait for API
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          for ($i = 1; $i -le 30; $i++) {
            try {
              $r = Invoke-WebRequest http://localhost:8000/health -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { Write-Host "API healthy."; exit 0 }
            } catch { Write-Host "Attempt $i failed." }
            Start-Sleep -Seconds 2
          }
          docker logs movewise-chatbot
          exit 1

      - name: Smoke test endpoints
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          foreach ($url in @(
            "http://localhost:8000/api/greeting",
            "http://localhost:8000/api/knowledge/stats"
          )) {
            Invoke-WebRequest $url -UseBasicParsing | Out-Null
            Write-Host "GET $url passed."
          }

          $postTests = @{
            "/api/chat"    = "What is a good beginner workout?"
            "/api/fitness" = "What exercise should I do?"
            "/api/health"  = "How much sleep should I get?"
            "/api/diet"    = "What should I eat?"
            "/api/food"    = "How many calories are in chicken?"
          }
          foreach ($path in $postTests.Keys) {
            $body = @{ message = $postTests[$path] } | ConvertTo-Json
            $r = Invoke-RestMethod -Uri "http://localhost:8000$path" -Method POST -ContentType "application/json" -Body $body
            if ($null -eq $r.message) { throw "No message from $path" }
            Write-Host "POST $path passed."
          }

      - name: Docker logs & cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker logs movewise-chatbot
          docker stop movewise-chatbot 2>$null
          docker rm movewise-chatbot 2>$null

  # ---------------- DEPLOY ----------------
  deploy:
    name: Auto Deploy
    runs-on: [self-hosted, Windows, X64]
    needs: [test, qa, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Trigger Render deploy
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RENDER_DEPLOY_HOOK)) { throw "RENDER_DEPLOY_HOOK not set" }
          $r = Invoke-WebRequest $env:RENDER_DEPLOY_HOOK -Method POST -UseBasicParsing
          if ($r.StatusCode -lt 200 -or $r.StatusCode -ge 300) { throw "Deploy hook failed: $($r.StatusCode)" }
          Write-Host "Deployment triggered."

  # ---------------- SMOKE TEST (PROD) ----------------
  smoke-test:
    name: Production Smoke Test
    runs-on: [self-hosted, Windows, X64]
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for deployment
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: Start-Sleep -Seconds 30

      - name: Production smoke test
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_URL)) { throw "PRODUCTION_URL not set" }
          $base = $env:PRODUCTION_URL.TrimEnd('/')

          Invoke-WebRequest "$base/health" -UseBasicParsing | Out-Null
          Invoke-WebRequest "$base/api/greeting" -UseBasicParsing | Out-Null

          $body = @{ message = "What is a good beginner workout?" } | ConvertTo-Json
          $r = Invoke-RestMethod -Uri "$base/api/chat" -Method POST -ContentType "application/json" -Body $body
          if ($null -eq $r.message) { throw "Production chatbot returned no message" }

          Write-Host "Production smoke test passed."
