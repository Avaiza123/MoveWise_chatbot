name: MoveWise Chatbot CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_EXE: 'C:\Users\avaiza.shahid\AppData\Local\Programs\Python\Python314\python.exe'
  VENV: '.ci-venv'

jobs:

  # ==========================================================
  # 1. AUTO TEST
  # ==========================================================
  test:
    name: Auto Test
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          if (-not (Test-Path $env:PYTHON_EXE)) {
            throw "Python 3.14 not found."
          }

          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
            Remove-Item $venv -Recurse -Force
          }

          & $env:PYTHON_EXE -m venv $venv

      - name: Install dependencies
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m pip install --upgrade pip

          & $python -m pip install `
            -r "$env:GITHUB_WORKSPACE\backend_chatbot\requirements.txt"

          & $python -m pip install `
            -r "$env:GITHUB_WORKSPACE\requirements-dev.txt"

      - name: Run tests
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m pytest `
            -v `
            --cov=backend_chatbot `
            --cov-report=term `
            --cov-report=xml:coverage.xml

          if ($LASTEXITCODE -ne 0) {
            throw "Tests failed."
          }

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
            Remove-Item $venv -Recurse -Force
          }


  # ==========================================================
  # 2. AUTO QA
  # ==========================================================
  qa:
    name: Auto QA
    runs-on: [self-hosted, Windows, X64]
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QA
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
            Remove-Item $venv -Recurse -Force
          }

          & $env:PYTHON_EXE -m venv $venv

          $python = Join-Path $venv "Scripts\python.exe"

          & $python -m pip install --upgrade pip

          & $python -m pip install `
            -r "$env:GITHUB_WORKSPACE\backend_chatbot\requirements.txt"

          & $python -m pip install `
            -r "$env:GITHUB_WORKSPACE\requirements-dev.txt"

      - name: Security scan
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: backend_chatbot
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m bandit `
            -r . `
            -x tests `
            -s B104,B110,B112

          if ($LASTEXITCODE -ne 0) {
            throw "Security QA failed."
          }

          Write-Host "Security QA passed."

      - name: Dependency audit
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: backend_chatbot
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m pip_audit -r requirements.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency audit failed."
          }

          Write-Host "Dependency audit passed."

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
            Remove-Item $venv -Recurse -Force
          }


  # ==========================================================
  # 3. DOCKER BUILD + TEST
  # ==========================================================
  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker version
          docker info

      - name: Build Docker image
        run: |
          docker build \
            -t movewise-chatbot:${{ github.sha }} \
            .

      - name: Run Docker container
        run: |
          docker run -d \
            --name movewise-chatbot \
            -p 8000:8000 \
            movewise-chatbot:${{ github.sha }}

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8000/health; then
              echo "Health check passed."
              exit 0
            fi

            echo "Application not ready yet. Attempt $i/10..."
            sleep 3
          done

          echo "Health check failed."
          docker logs movewise-chatbot
          exit 1

      - name: Docker logs
        if: failure()
        run: |
          docker logs movewise-chatbot

      - name: Cleanup Docker container
        if: always()
        run: |
          docker stop movewise-chatbot || true
          docker rm movewise-chatbot || true

