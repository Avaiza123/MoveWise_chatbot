name: MoveWise Chatbot CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  test:
    name: Auto Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests with coverage
        run: |
          pytest -v \
            --cov=. \
            --cov-report=term \
            --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  qa:
    name: Auto QA
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff bandit pip-audit

      - name: Ruff lint
        run: |
          ruff check .

      - name: Ruff format check
        run: |
          ruff format --check .

      - name: Security scan
        run: |
          bandit -r . -x tests

      - name: Dependency security audit
        run: |
          pip-audit

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs:
      - test
      - qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t movewise-chatbot:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker image inspect movewise-chatbot:${{ github.sha }}
    deploy:
    name: Auto Deploy
    runs-on: ubuntu-latest

    needs:
      - test
      - qa
      - build

    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      - name: Deploy application
        run: |
          echo "Deploying MoveWise Chatbot..."