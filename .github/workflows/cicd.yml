name: MoveWise Chatbot CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_EXE: 'C:\Users\avaiza.shahid\AppData\Local\Programs\Python\Python314\python.exe'
  VENV: '.ci-venv'

jobs:

  # ==========================================================
  # 1. TEST
  # ==========================================================
  test:
    name: Auto Test
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          if (-not (Test-Path $env:PYTHON_EXE)) {
            throw "Python 3.14 not found: $env:PYTHON_EXE"
          }

          & $env:PYTHON_EXE --version

          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
            Remove-Item $venv -Recurse -Force
          }

          & $env:PYTHON_EXE -m venv $venv

          if ($LASTEXITCODE -ne 0) {
            throw "Virtual environment creation failed."
          }

      - name: Install dependencies
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "pip upgrade failed."
          }

          & $python -m pip install -r "$env:GITHUB_WORKSPACE\backend_chatbot\requirements.txt"
          if ($LASTEXITCODE -ne 0) {
            throw "Backend dependency installation failed."
          }

          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements-dev.txt"
          if ($LASTEXITCODE -ne 0) {
            throw "Development dependency installation failed."
          }

          & $python -c "import flask, fastapi, sklearn, pytest; print('Dependencies OK')"

      - name: Run tests
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m pytest `
            -v `
            --cov=backend_chatbot `
            --cov-report=term `
            --cov-report=xml:coverage.xml

          if ($LASTEXITCODE -ne 0) {
            throw "Tests failed."
          }

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
            Remove-Item $venv -Recurse -Force
          }


  # ==========================================================
  # 2. QA
  # ==========================================================
  qa:
    name: Auto QA
    runs-on: [self-hosted, Windows, X64]
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup QA environment
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
            Remove-Item $venv -Recurse -Force
          }

          & $env:PYTHON_EXE -m venv $venv

          if ($LASTEXITCODE -ne 0) {
            throw "QA virtual environment creation failed."
          }

          $python = Join-Path $venv "Scripts\python.exe"

          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "QA pip upgrade failed."
          }

          & $python -m pip install -r "$env:GITHUB_WORKSPACE\backend_chatbot\requirements.txt"
          if ($LASTEXITCODE -ne 0) {
            throw "QA backend dependency installation failed."
          }

          & $python -m pip install -r "$env:GITHUB_WORKSPACE\requirements-dev.txt"
          if ($LASTEXITCODE -ne 0) {
            throw "QA development dependency installation failed."
          }

      - name: Ruff
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: backend_chatbot
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m ruff check .

          if ($LASTEXITCODE -ne 0) {
            throw "Ruff check failed."
          }

      - name: Format check
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: backend_chatbot
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m ruff format --check .

          if ($LASTEXITCODE -ne 0) {
            throw "Formatting check failed."
          }

      - name: Security scan
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: backend_chatbot
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m bandit -r . -x tests

          if ($LASTEXITCODE -ne 0) {
            throw "Bandit security scan failed."
          }

      - name: Dependency audit
        shell: powershell -ExecutionPolicy Bypass -File {0}
        working-directory: backend_chatbot
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "$env:VENV\Scripts\python.exe"

          & $python -m pip_audit -r requirements.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency audit failed."
          }

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE $env:VENV

          if (Test-Path $venv) {
            Remove-Item $venv -Recurse -Force
          }


  # ==========================================================
  # 3. DOCKER BUILD + RUNTIME QA
  # ==========================================================
  docker:
    name: Docker QA
    runs-on: [self-hosted, Windows, X64]
    needs: [test, qa]

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker build -t movewise-chatbot:${{ github.sha }} .

          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed."
          }

      - name: Run container
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker rm -f movewise-chatbot 2>$null

          docker run -d `
            --name movewise-chatbot `
            -p 8000:8000 `
            movewise-chatbot:${{ github.sha }}

          if ($LASTEXITCODE -ne 0) {
            throw "Docker container failed to start."
          }

      - name: Runtime smoke test
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $ready = $false

          for ($i = 1; $i -le 30; $i++) {
            try {
              $r = Invoke-WebRequest `
                -Uri "http://localhost:8000/health" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($r.StatusCode -eq 200) {
                $ready = $true
                break
              }
            }
            catch {}

            Start-Sleep 2
          }

          if (-not $ready) {
            docker logs movewise-chatbot
            throw "Docker API did not become healthy."
          }

          $health = Invoke-RestMethod `
            -Uri "http://localhost:8000/health"

          if ($health.status -ne "healthy") {
            throw "Health check failed."
          }

          $greeting = Invoke-RestMethod `
            -Uri "http://localhost:8000/api/greeting"

          if (-not $greeting.message) {
            throw "Greeting check failed."
          }

          $body = @{
            message = "What is a good beginner workout?"
          } | ConvertTo-Json

          $chat = Invoke-RestMethod `
            -Uri "http://localhost:8000/api/chat" `
            -Method POST `
            -ContentType "application/json" `
            -Body $body

          if (-not $chat.message) {
            throw "Chat endpoint failed."
          }

          Write-Host "Docker runtime QA PASSED."

      - name: Docker logs
        if: always()
        continue-on-error: true
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker logs movewise-chatbot

      - name: Cleanup
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          docker stop movewise-chatbot 2>$null
          docker rm movewise-chatbot 2>$null


  # ==========================================================
  # 4. DEPLOY
  # ==========================================================
  deploy:
    name: Production Deploy
    runs-on: [self-hosted, Windows, X64]
    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Deploy to Render
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RENDER_DEPLOY_HOOK)) {
            throw "RENDER_DEPLOY_HOOK is not configured."
          }

          $response = Invoke-WebRequest `
            -Uri $env:RENDER_DEPLOY_HOOK `
            -Method POST `
            -UseBasicParsing

          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
            throw "Render deployment failed."
          }

          Write-Host "Deployment triggered successfully."


  # ==========================================================
  # 5. PRODUCTION SMOKE TEST
  # ==========================================================
  production-smoke:
    name: Production Smoke Test
    runs-on: [self-hosted, Windows, X64]
    needs: deploy

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Verify production
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_URL)) {
            throw "PRODUCTION_URL is not configured."
          }

          $base = $env:PRODUCTION_URL.TrimEnd('/')
          $ready = $false

          for ($i = 1; $i -le 30; $i++) {
            try {
              $health = Invoke-RestMethod `
                -Uri "$base/health" `
                -TimeoutSec 10

              if ($health.status -eq "healthy") {
                $ready = $true
                break
              }
            }
            catch {}

            Start-Sleep 10
          }

          if (-not $ready) {
            throw "Production API is not healthy."
          }

          $greeting = Invoke-RestMethod `
            -Uri "$base/api/greeting"

          if (-not $greeting.message) {
            throw "Production greeting failed."
          }

          $body = @{
            message = "What is a good beginner workout?"
          } | ConvertTo-Json

          $chat = Invoke-RestMethod `
            -Uri "$base/api/chat" `
            -Method POST `
            -ContentType "application/json" `
            -Body $body `
            -TimeoutSec 30

          if (-not $chat.message) {
            throw "Production chatbot failed."
          }

          Write-Host "========================================"
          Write-Host "PRODUCTION SMOKE TEST PASSED"
          Write-Host "========================================"
